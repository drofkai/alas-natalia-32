<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alas para soñar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
<style>
/* Layout: libro a pantalla completa, una página-ilustración por vista, barra de navegación abajo.
   Una sola apariencia nocturna a propósito (bosque de noche), igual en claro y oscuro. */
:root{
  --bg:#150f1f; --bar:#1f1630; --ink:#fbeed6; --muted:#b9a9c9;
  --amber:#ffb347; --amber-ink:#2a1608; --wood:#6b4528; --dot:#4a3a63;
  --ui:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--ui); font-size:16px;
  display:flex; flex-direction:column; overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px 10px;
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
}
#stage{flex:1; min-height:0; position:relative; overflow:hidden; container-type:size; touch-action:pan-y; border-radius:10px}
.slide{position:absolute; inset:0; display:grid; place-items:center; transition:transform .45s cubic-bezier(.3,.7,.2,1), opacity .45s; will-change:transform}
.frame{
  position:relative; aspect-ratio:var(--ar);
  width:min(100cqw, calc(100cqh * var(--ar)));
  border-radius:8px; overflow:hidden; background:#241936;
  box-shadow:0 10px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
}
.frame img{display:block; width:100%; height:100%; object-fit:cover; -webkit-user-drag:none}

/* Zona clicable sobre la pantalla del arcade (última página) */
.play{position:absolute; left:24.5%; top:11.5%; width:51%; height:62%; display:block; border-radius:6px; cursor:pointer; outline-offset:3px}
.play .ring{position:absolute; left:50.5%; top:84.5%; width:36%; height:14%; transform:translate(-50%,-50%);
  border:3px solid #fff4e0; border-radius:4px; box-shadow:0 0 18px 4px rgba(255,79,163,.85), inset 0 0 12px rgba(255,79,163,.6);
  animation:pulse 1.3s ease-in-out infinite}
.play:focus-visible{outline:3px solid var(--amber)}
@keyframes pulse{0%,100%{opacity:.25; transform:translate(-50%,-50%) scale(1)}50%{opacity:1; transform:translate(-50%,-50%) scale(1.06)}}

#bar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-top:10px}
.nav{
  flex:none; min-width:48px; height:44px; padding:0 16px; border:0; border-radius:22px; cursor:pointer;
  font:600 16px var(--ui); color:var(--ink); background:var(--bar); box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);
  display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none;
}
.nav:hover:not(:disabled){background:#2c2142}
.nav:focus-visible{outline:3px solid var(--amber); outline-offset:2px}
.nav:disabled{opacity:.3; cursor:default}
.nav.go{background:var(--amber); color:var(--amber-ink); box-shadow:0 0 0 0 rgba(255,179,71,.6); animation:glow 1.6s infinite}
@keyframes glow{70%{box-shadow:0 0 0 12px rgba(255,179,71,0)}100%{box-shadow:0 0 0 0 rgba(255,179,71,0)}}
#mid{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:6px}
#label{font-size:14px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
#dots{display:flex; gap:6px; flex-wrap:wrap; justify-content:center}
#dots button{width:8px; height:8px; padding:0; border:0; border-radius:50%; background:var(--dot); cursor:pointer}
#dots button[aria-current="true"]{background:var(--amber); width:20px; border-radius:4px}
#dots button:focus-visible{outline:2px solid var(--amber); outline-offset:2px}

#rotate{display:none; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; padding:8px 12px; border-radius:12px; background:var(--bar); font-size:14px; color:var(--ink)}
#rotate button{border:0; background:none; color:var(--amber); font:600 14px var(--ui); cursor:pointer; padding:4px 6px}
@media (orientation:portrait) and (max-width:700px){ #rotate:not([hidden]){display:flex} #mid #label{display:none} }
@media (max-width:420px){ .nav .txt{display:none} .nav{padding:0 14px} }
/* animación suave de las ilustraciones */
.slide.active:not(.last) .frame img{animation:kb 22s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.045) translate(-.7%,-.5%)}}
.fx{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
@media (prefers-reduced-motion:reduce){ .slide .frame img{animation:none!important} .fx{display:none} .slide{transition:none} .play .ring,.nav.go{animation:none} }

#music{position:fixed; z-index:20; top:calc(env(safe-area-inset-top,0px) + 12px); right:max(16px,env(safe-area-inset-right,0px));
  width:40px; height:40px; padding:0; border:0; border-radius:50%; cursor:pointer; color:var(--ink);
  background:rgba(21,15,31,.72); box-shadow:inset 0 0 0 1px rgba(255,255,255,.18); display:grid; place-items:center; backdrop-filter:blur(4px)}
#music:focus-visible{outline:3px solid var(--amber); outline-offset:2px}
#music svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
#music .off{display:none} #music[aria-pressed="false"] .on{display:none} #music[aria-pressed="false"] .off{display:block}
#rotate{margin-right:52px}
</style>
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>

<button id="music" type="button" aria-pressed="true" aria-label="Música de fondo" title="Música">
  <svg viewBox="0 0 24 24" aria-hidden="true"><g class="on"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></g><g class="off"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/><path d="M3 3l18 18"/></g></svg>
</button>
<audio id="bgm" src="audio/for-you.mp3" loop preload="auto"></audio>
<div id="rotate"><span>↻ Gira el celular para leer mejor el libro</span><button id="rotate-x" type="button">Listo</button></div>
<main id="stage" aria-roledescription="libro" aria-label="Alas para soñar"></main>
<nav id="bar" aria-label="Páginas">
  <button class="nav" id="prev" type="button" aria-label="Página anterior">◀<span class="txt">Anterior</span></button>
  <div id="mid"><div id="label" aria-live="polite"></div><div id="dots"></div></div>
  <button class="nav" id="next" type="button" aria-label="Página siguiente"><span class="txt">Siguiente</span>▶</button>
</nav>

<script>
(function(){
  var T=['Portada','La fruta imposible','Mensajes que no terminaban','Un baile entre dos mundos','Conversaciones y caminos conectados','Comienza la gran aventura','El hogar','Una casa llena de historias','Los guardianes','Ganas de volar','Emprender','Contra el mundo, juntos','Dedicatoria','Natalia 32'];
  var AR=Array(14).fill(16/9);
  var GAME='juego.html', last=T.length-1, cur=0;
  var stage=document.getElementById('stage'), dots=document.getElementById('dots');
  var label=document.getElementById('label'), prev=document.getElementById('prev'), next=document.getElementById('next');
  var slides=[];

  T.forEach(function(t,i){
    var s=document.createElement('div'); s.className='slide'+(i===last?' last':'');
    var f=document.createElement('div'); f.className='frame'; f.style.setProperty('--ar',AR[i]);
    var im=document.createElement('img'); im.alt=i===0?'Portada: Alas para soñar, un cuento de aventuras, compañía y nuevos comienzos':'Página: '+t; im.draggable=false;
    im.dataset.src='img/p'+String(i).padStart(2,'0')+'.webp';
    f.appendChild(im);
    if(i===last){
      var a=document.createElement('a'); a.className='play'; a.href=GAME; a.setAttribute('aria-label','Jugar Natalia Nivel 32');
      a.innerHTML='<span class="ring"></span>'; f.appendChild(a);
    }
    s.appendChild(f); stage.appendChild(s); slides.push(s);
    var d=document.createElement('button'); d.type='button'; d.setAttribute('aria-label',t);
    d.addEventListener('click',function(){go(i)}); dots.appendChild(d);
  });

  function load(i){ if(i<0||i>last)return; var im=slides[i].querySelector('img'); if(im.dataset.src&&!im.src){im.src=im.dataset.src} }
  function render(){
    slides.forEach(function(s,i){
      var x=(i-cur)*100; s.style.transform='translateX('+x+'%)'; s.style.opacity=Math.abs(i-cur)>1?0:1; s.style.pointerEvents=i===cur?'auto':'none';
      s.setAttribute('aria-hidden',i===cur?'false':'true'); s.classList.toggle('active',i===cur);
      var a=s.querySelector('a'); if(a)a.tabIndex=i===cur?0:-1;
    });
    [].forEach.call(dots.children,function(d,i){ if(i===cur)d.setAttribute('aria-current','true'); else d.removeAttribute('aria-current') });
    label.textContent=cur===0?'Portada':cur===last?'Juego final':(cur===12?'Dedicatoria':'Página '+cur+' de 11 · '+T[cur]);
    prev.disabled=cur===0;
    var txt=next.querySelector('.txt');
    if(cur===last){ next.classList.add('go'); next.innerHTML='<span class="txt">Jugar</span>▶'; next.setAttribute('aria-label','Jugar Natalia Nivel 32') }
    else { next.classList.remove('go'); next.innerHTML='<span class="txt">'+(cur===0?'Abrir':'Siguiente')+'</span>▶'; next.setAttribute('aria-label','Página siguiente') }
    load(cur); load(cur+1); load(cur-1); fxStart(cur);
    try{ history.replaceState(null,'',cur===0?location.pathname:'#pagina-'+cur) }catch(e){}
  }

  /* partículas suaves sobre cada ilustración */
  var MOOD=['fireflies','motes','fireflies','notes','stars','motes','fireflies','sparks','hearts','leaves','motes','leaves','fireflies','stars'];
  var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv=null, cx=null, parts=[], raf=0, lt=0, mood='motes', xm=0, W=0, H=0, DPR=1, tt=0;
  var LEAF=['#e0a030','#a9bf3c','#d9822b','#c7d65a'];
  function spawn(init){
    var p={x:xm+Math.random()*(1-xm), y:init?Math.random():(mood==='leaves'?-.05:1.05), ph:Math.random()*6.28, s:.6+Math.random()*.8, c:LEAF[Math.floor(Math.random()*4)]};
    if(mood==='stars'){p.y=Math.random()*.55}
    return p;
  }
  function fit(){ if(!cv)return; DPR=Math.min(2,window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR }
  function glow(x,y,r,a,col){ var g=cx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,'rgba('+col+','+a+')'); g.addColorStop(1,'rgba('+col+',0)'); cx.fillStyle=g; cx.beginPath(); cx.arc(x,y,r,0,6.2832); cx.fill() }
  function frame(now){
    raf=requestAnimationFrame(frame);
    var dt=Math.min(.05,(now-lt)/1000); lt=now; tt+=dt; if(!W)return;
    cx.setTransform(DPR,0,0,DPR,0,0); cx.clearRect(0,0,W,H);
    var u=Math.min(W,H)/400+.6;
    parts.forEach(function(p,i){
      p.ph+=dt*p.s;
      if(mood==='fireflies'){ p.x+=Math.sin(p.ph*.7)*.012*dt*p.s; p.y+=Math.cos(p.ph*.5)*.01*dt; var a=.25+.75*Math.max(0,Math.sin(p.ph*1.6)); glow(p.x*W,p.y*H,10*u,a*.55,'255,225,120'); glow(p.x*W,p.y*H,2.5*u,a,'255,250,210') }
      else if(mood==='motes'){ p.y-=.012*p.s*dt; p.x+=Math.sin(p.ph)*.006*dt; var a2=Math.sin(Math.min(1,Math.max(0,(1.05-p.y)/1.1))*3.14); glow(p.x*W,p.y*H,6*u*p.s,.55*a2,'255,240,190') }
      else if(mood==='sparks'){ p.y-=.03*p.s*dt; p.x+=Math.sin(p.ph*2)*.01*dt; var a3=Math.sin(Math.min(1,Math.max(0,(1.05-p.y)/1.1))*3.14); glow(p.x*W,p.y*H,5*u,.8*a3,'255,170,70') }
      else if(mood==='leaves'){ p.y+=.045*p.s*dt; p.x+=Math.sin(p.ph*1.3)*.018*dt-.004*dt; cx.save(); cx.translate(p.x*W,p.y*H); cx.rotate(p.ph*1.5); cx.fillStyle=p.c; cx.globalAlpha=.8; cx.beginPath(); cx.ellipse(0,0,5*u,2.4*u,0,0,6.2832); cx.fill(); cx.restore() }
      else if(mood==='notes'||mood==='hearts'){ p.y-=.04*p.s*dt; p.x+=Math.sin(p.ph*1.2)*.01*dt; var a4=Math.sin(Math.min(1,Math.max(0,(1.05-p.y)/1.1))*3.14); cx.globalAlpha=.85*a4; cx.fillStyle=mood==='notes'?'#ffd98a':'#ff8fb8'; cx.font=(14*u*p.s)+'px sans-serif'; cx.fillText(mood==='notes'?(i%2?'♪':'♫'):'♥',p.x*W,p.y*H); cx.globalAlpha=1 }
      else if(mood==='stars'){ var a5=.2+.8*Math.max(0,Math.sin(p.ph*1.8)); glow(p.x*W,p.y*H,7*u*p.s,a5*.7,'200,225,255'); glow(p.x*W,p.y*H,1.6*u,a5,'255,255,255') }
      if(p.y<-.08||p.y>1.1||p.x<-.05||p.x>1.05){ parts[i]=spawn(false) }
    });
  }
  function fxStart(i){
    if(RM)return;
    cancelAnimationFrame(raf); if(cv&&cv.parentNode)cv.parentNode.removeChild(cv);
    mood=MOOD[i]; xm=(i>=1&&i<=12)?.38:0;
    cv=document.createElement('canvas'); cv.className='fx'; cv.setAttribute('aria-hidden','true');
    slides[i].querySelector('.frame').insertBefore(cv,slides[i].querySelector('.play'));
    cx=cv.getContext('2d'); fit();
    var n=mood==='stars'?26:mood==='fireflies'?18:mood==='notes'||mood==='hearts'?8:mood==='leaves'?9:16;
    parts=[]; for(var k=0;k<n;k++)parts.push(spawn(true));
    lt=performance.now(); raf=requestAnimationFrame(frame);
  }
  window.addEventListener('resize',fit);
  document.addEventListener('visibilitychange',function(){ if(document.hidden)cancelAnimationFrame(raf); else if(cv){lt=performance.now();raf=requestAnimationFrame(frame)} });
  function go(i){ cur=Math.max(0,Math.min(last,i)); render() }
  function fwd(){ if(cur===last){ location.href=GAME } else go(cur+1) }
  prev.addEventListener('click',function(){go(cur-1)});
  next.addEventListener('click',fwd);

  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'){go(cur+1);e.preventDefault()}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(cur-1);e.preventDefault()}
    else if(e.key==='Home'){go(0)} else if(e.key==='End'){go(last)}
  });

  /* deslizar con el dedo / mouse y tocar mitades de la página */
  var sx=null, sy=0, moved=false;
  stage.addEventListener('pointerdown',function(e){ sx=e.clientX; sy=e.clientY; moved=false });
  stage.addEventListener('pointermove',function(e){ if(sx!==null&&Math.abs(e.clientX-sx)>10)moved=true });
  stage.addEventListener('pointerup',function(e){
    if(sx===null)return; var dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){ go(cur+(dx<0?1:-1)); return }
    if(moved||e.target.closest('a'))return;
    var r=stage.getBoundingClientRect(); if(e.clientX-r.left<r.width*0.35)go(cur-1); else if(cur<last)go(cur+1);
  });
  stage.addEventListener('pointercancel',function(){sx=null});
  stage.addEventListener('dragstart',function(e){e.preventDefault()});

  document.getElementById('rotate-x').addEventListener('click',function(){document.getElementById('rotate').hidden=true});

  var m=/^#pagina-(\d+)$/.exec(location.hash); if(m)cur=Math.min(last,parseInt(m[1],10));
  window.addEventListener('hashchange',function(){var h=/^#pagina-(\d+)$/.exec(location.hash); if(h){cur=Math.min(last,parseInt(h[1],10));render()}});
  render();

  /* música de fondo: muy baja, empieza con el primer toque */
  var bgm=document.getElementById('bgm'), mb=document.getElementById('music'), VOL=0.015, want=true, fade=null;
  try{ if(localStorage.getItem('bgm-off')==='1')want=false }catch(e){}
  mb.setAttribute('aria-pressed',want?'true':'false');
  function ramp(to,done){
    clearInterval(fade);
    fade=setInterval(function(){
      var d=to-bgm.volume; if(Math.abs(d)<0.01){bgm.volume=to;clearInterval(fade);if(done)done();return}
      bgm.volume=Math.max(0,Math.min(1,bgm.volume+(d>0?0.01:-0.02)));
    },60);
  }
  function start(){
    if(!want||!bgm.paused)return;
    bgm.volume=0; var p=bgm.play(); if(p&&p.then)p.then(function(){ramp(VOL)}).catch(function(){}); else ramp(VOL);
  }
  ['pointerup','keydown'].forEach(function(ev){ document.addEventListener(ev,start) });
  mb.addEventListener('click',function(e){
    e.stopPropagation(); want=!want; mb.setAttribute('aria-pressed',want?'true':'false');
    try{ localStorage.setItem('bgm-off',want?'0':'1') }catch(x){}
    if(want){ start() } else { ramp(0,function(){bgm.pause()}) }
  });
  mb.addEventListener('pointerup',function(e){e.stopPropagation()});
  document.addEventListener('visibilitychange',function(){ if(document.hidden)bgm.pause(); else if(want&&bgm.currentTime>0)bgm.play().catch(function(){}) });
})();
</script>

</body></html>
